<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083D33"/>
      <stop offset="50%" stop-color="#0E6655"/>
      <stop offset="100%" stop-color="#144D42"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#F1C40F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Decorative Pattern Elements -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="1100" cy="80" r="160"/>
    <circle cx="1100" cy="80" r="120"/>
    <circle cx="1100" cy="80" r="80"/>
    <circle cx="80" cy="300" r="140"/>
    <circle cx="80" cy="300" r="100"/>
    <path d="M 0,180 Q 300,100 600,180 T 1200,180" stroke-width="2"/>
    <path d="M 0,220 Q 300,140 600,220 T 1200,220" stroke-width="2"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(60, 42)">
    <rect width="250" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#2ECC71"/>
    <text x="32" y="20" fill="#E8F8F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PYTHON 3.10+ APPLICATION</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-1">
    Smart Life Planner
  </text>
  
  <text x="60" y="172" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    Pakistan Trip Planner &amp; Monthly Budget Manager
  </text>

  <text x="60" y="210" fill="#D1F2EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Intelligent Budget Optimization &bull; Deterministic Cost Engine &bull; ReportLab Multi-Page PDF &bull; 73 Pytest Units
  </text>

  <!-- Feature Cards on the Right -->
  <g transform="translate(760, 45)">
    <!-- Card 1: Module 1 -->
    <rect x="0" y="0" width="380" height="120" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Mountain Icon -->
    <g transform="translate(20, 16)">
      <polygon points="12,24 22,8 32,24" fill="#F1C40F"/>
      <polygon points="24,24 30,14 38,24" fill="#F39C12"/>
      <polygon points="2,24 8,16 16,24" fill="#F1C40F" opacity="0.8"/>
    </g>
    <text x="68" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Module 1: Pakistan Trip Planner</text>
    <text x="24" y="68" fill="#D1F2EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">9 Destination Catalogs &bull; Murree, Hunza, Skardu</text>
    <text x="24" y="90" fill="#A3E4D7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">5-Strategy Algorithmic Budget Optimizer</text>

    <!-- Card 2: Module 2 -->
    <rect x="0" y="140" width="380" height="120" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Wallet / Card Icon -->
    <g transform="translate(20, 156)">
      <rect x="4" y="6" width="32" height="22" rx="4" fill="#2ECC71"/>
      <rect x="4" y="12" width="32" height="5" fill="#0E6655"/>
      <circle cx="28" cy="21" r="2.5" fill="#F1C40F"/>
    </g>
    <text x="68" y="176" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Module 2: Monthly Budget Manager</text>
    <text x="24" y="208" fill="#D1F2EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">Home &amp; Kitchen &bull; Personal Finance &bull; Custom</text>
    <text x="24" y="230" fill="#A3E4D7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Counter &amp; Deque &bull; Real-time Overspending Alerts</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 265)">
    <line x1="0" y1="0" x2="670" y2="0" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <text x="0" y="32" fill="#E8F8F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      Author: Muhammad Ali Ajaz
    </text>
    <text x="230" y="32" fill="#A3E4D7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
      GitHub: @muhammadaliajaz
    </text>
    <text x="440" y="32" fill="#A3E4D7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
      chaudharyaliajaz@gmail.com
    </text>
  </g>
</svg>
